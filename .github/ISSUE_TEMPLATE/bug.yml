name: Bug report
description: Report a reproducible CF-MCP defect using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include access tokens, Portal grants, provider identifiers, private URLs, or raw Cloudflare data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Access mode
      options: [standalone, portal]
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Tool
      placeholder: get_endpoint_coverage
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use placeholders, synthetic resource IDs, and provider-free behavior where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, account/zone/resource IDs, provider data, private topology, and unredacted logs.
          required: true
        - label: This report does not describe a security vulnerability that belongs in private reporting.
          required: true
